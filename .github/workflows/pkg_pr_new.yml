name: Publish Any Commit
on: [push, pull_request]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup npmrc
        run: mv .npmrc_example .npmrc

      - uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@26
          cache: true

      - run: corepack enable
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 26
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Build
        run: vp pack

      - run: vp exec pkg-pr-new publish --pnpm --commentWithSha
